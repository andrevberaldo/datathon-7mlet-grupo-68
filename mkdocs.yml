site_name: datathon-7mlet-grupo-68
site_description: HP Invest — backend, frontend e Admin Assistant
repo_url: https://github.com/andrevberaldo/datathon-7mlet-grupo-68
docs_dir: docs

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

nav:
  - Home: index.md
  - Requisitos do Datathon: requirements.md
  - Arquitetura:
      - Admin Assistant: architecture/admin-assistant.md
      - Visão geral do sistema: architecture/system-overview.md
      - Recursos de nuvem (produção): architecture/cloud-resources.md
      - Modelo de domínio: domain-model.md
      - Roadmap do backend: backend-roadmap.md
  - Serviços:
      - api_service: services/api-service.md
      - model_service: services/model-service.md
      - front_service: services/front-service.md
      - agent_service: services/agent-service.md
      - mcp_server: services/mcp-server.md
      - dashboard: services/dashboard.md
  - API:
      - Contratos: api-contracts.md
      - Integração com o front: front-integration.md
  - Operação:
      - Infraestrutura: infra.md
      - Observabilidade: observability-datadog.md

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - toc:
      permalink: true
